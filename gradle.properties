# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# 目标版本：Minecraft 26.3（与本地 fabric-carpet-26.3 源码一致）
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.17.21

# Mod Properties
mod_version=1.0.0
maven_group=com.hermeslib
archives_base_name=hermes-lib

# Carpet 附属依赖（JitPack 构建的官方 Carpet 产物）
carpet_version=26.3

# SQLite 持久化驱动
sqlite_version=3.53.4.0
